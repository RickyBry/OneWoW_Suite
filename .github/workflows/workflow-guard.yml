name: Workflow guard

# Fails if a workflow pushes, moves or deletes tags (see .github/scripts/check_no_tag_push.py).
on:
  push:
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions:
  contents: read

jobs:
  no-tag-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python .github/scripts/check_no_tag_push.py
