name: Publish nightly zip

on:
  push:
    branches: [main]
    paths:
      - "OneWoW/**"
      - "OneWoW_*/**"
      - "bin/pack_github_zip.py"
      - "bin/onewow_release_lib.py"
      - ".github/workflows/publish-nightly.yml"
  workflow_dispatch:

concurrency:
  group: publish-nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pack nightly zip
        run: python bin/pack_github_zip.py --name OneWoW-Suite-Nightly.zip
      - name: Replace nightly asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload nightly .releases/OneWoW-Suite-Nightly.zip --clobber
      - name: Move nightly tag to the built commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" -f sha="${GITHUB_SHA}" -F force=true
      - name: Refresh nightly notes and publish date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'bin'); from onewow_release_lib import require_uniform_version; print(require_uniform_version())")
          TIP="${GITHUB_SHA:0:7}"
          STAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo "Bot-managed rolling zip for **OneWoW Suite — Nightly**."
            echo
            echo "- TOC version: \`${VERSION}\`"
            echo "- Tip: \`${TIP}\`"
            echo "- Updated: ${STAMP}"
            echo
            echo "Source: current \`main\` tip (not a CurseForge release)."
          } > "${RUNNER_TEMP}/nightly-notes.md"
          # Draft and republish so the release date shows this build; the asset URL is unchanged.
          gh release edit nightly --draft=true
          gh release edit nightly --draft=false --prerelease --target "${GITHUB_SHA}" --notes-file "${RUNNER_TEMP}/nightly-notes.md"
